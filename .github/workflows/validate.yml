name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: HACS changes its rules without anything being committed here —
    # yesterday's green run says little otherwise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin

  card:
    name: card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The bundle is not committed, so a broken rollup config would otherwise
      # only surface during a release.
      - run: npm run build
